<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>MajorMate - Sign Up</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <!--header-->
        <header>
            <img src="images/MajorMate.png" alt="MajorMate Logo" width="400" height="120" usemap="#MajorMate">
            <map name="MajorMate">
                <area shape="rect" coords="0,0,400,120" href="about.html" alt="About us">
            </map>    
        </header>

        <!--nav-->
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="majors.html">Majors</a></li>
                <li><a href="major-details.html">Major Details</a></li>
                <li><a href="login.html">Login</a></li>
                <li><a href="signup.html">Sign Up</a></li>
            </ul>
        </nav>

        <!--main-->
        <main>
            <h1>Sign Up</h1>
            <p>Happy to have you with us! Please fill out the form below to create your account:</p>
            <form method="post" action="#">
                <label>Full Name: <input type="text" name="fullname" placeholder="Ahmed Hassan" required></label><br>
                <label>Email: <input type="email" name="email" placeholder="mail@example.com" required></label><br>
                <label>Password: <input type="password" name="pwd" required></label><br>
                <label>Date of Birth: <input type="date" name="dob"></label><br>
                Gender: <br>
                    <label><input type="radio" name="gender" value="male" required> Male </label><br>
                    <label><input type="radio" name="gender" value="female"> Female </label><br>
                <label>Major: 
                    <select name="major">
                        <option value="cs">Computer Science</option>
                        <option value="it">Information Technology</option>
                        <option value="is">Information Systems</option>
                        <option value="other">Not sure yet</option>
                    </select>
                </label><br>
                <input type="submit" value="Sign Up">
                <input type="reset" value="Reset">
            </form>
            <p>Already have an account? <a href="login.html">Log In</a></p>
        </main>

        <!--footer-->
        <footer>
            <p>&copy; 2026 MajorMate. All rights reserved.</p>
            <a href="mailto:team@example.com">Contact Us</a>
        </footer>
    </body>
</html>
